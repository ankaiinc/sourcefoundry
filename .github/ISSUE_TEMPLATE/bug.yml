name: Bug report
description: Report reproducible SourceFoundry behavior that differs from the documented contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include API tokens, provider keys, private source URLs, or customer data.
  - type: input
    id: version
    attributes:
      label: SourceFoundry version
      description: Release tag, container tag, or full commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Hosted service
        - Docker Compose
        - Custom self-hosted deployment
        - MCP adapter only
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Include minimal redacted steps and relevant health output.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private source URLs, and customer data.
          required: true
