name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contract, tests, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sourcefoundry
          POSTGRES_USER: sourcefoundry
          POSTGRES_PASSWORD: sourcefoundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcefoundry -d sourcefoundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan committed content for secrets
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mcp

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix mcp --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Apply portable migrations twice
        env:
          SOURCEFOUNDRY_DATABASE_URL: postgresql://sourcefoundry:sourcefoundry@127.0.0.1:5432/sourcefoundry?sslmode=disable
        run: |
          npm run migrate
          npm run migrate

      - name: Verify MCP and self-hosted packaging
        env:
          SOURCEFOUNDRY_API_TOKEN: ci-compose-validation-token
        run: |
          node --check mcp/sourcefoundry-mcp.mjs
          SOURCEFOUNDRY_API_TOKEN=ci-mcp-execution-token SOURCEFOUNDRY_BASE=http://127.0.0.1:8080 node mcp/sourcefoundry-mcp.mjs < /dev/null
          npm pack --dry-run ./mcp
          docker compose config --quiet
