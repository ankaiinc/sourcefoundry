name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm ci --prefix mcp
          npm run type-check
          npm test
          npm run build
          node --check mcp/sourcefoundry-mcp.mjs

      - name: Pack MCP adapter
        run: |
          mkdir -p release
          npm pack ./mcp --pack-destination release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish container
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          build-args: |
            SOURCEFOUNDRY_RELEASE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/ankaiinc/sourcefoundry:${{ github.ref_name }}
            ghcr.io/ankaiinc/sourcefoundry:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release/*.tgz
