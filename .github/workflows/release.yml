name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag matches this commit
        shell: bash
        run: |
          case "$RELEASE_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $RELEASE_VERSION" >&2; exit 1 ;;
          esac
          test "$(git rev-parse "${RELEASE_VERSION}^{commit}")" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm ci --prefix mcp
          npm run type-check
          npm test
          npm run build
          node --check mcp/sourcefoundry-mcp.mjs

      - name: Pack MCP adapter
        run: |
          mkdir -p release
          npm pack ./mcp --pack-destination release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish container
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          build-args: |
            SOURCEFOUNDRY_RELEASE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/ankaiinc/sourcefoundry:${{ env.RELEASE_VERSION }}
            ghcr.io/ankaiinc/sourcefoundry:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_VERSION }}
          body_path: .github/release-notes/${{ env.RELEASE_VERSION }}.md
          files: release/*.tgz
