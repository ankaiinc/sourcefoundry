app = "sourcefoundry"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SOURCEFOUNDRY_PORT = "8080"
  SOURCEFOUNDRY_PUBLIC_BASE_URL = "https://sources.4agents.fyi"
  SOURCEFOUNDRY_WORKER_INTERVAL_MS = "30000"
  SOURCEFOUNDRY_WORKER_CONCURRENCY = "3"
  SOURCEFOUNDRY_STALE_JOB_MINUTES = "30"
  SOURCEFOUNDRY_MAX_ATTEMPTS = "5"
  SOURCEFOUNDRY_SELF_SERVICE_ENABLED = "1"
  SOURCEFOUNDRY_SELF_SERVICE_MAX_SOURCES = "3"
  SOURCEFOUNDRY_SELF_SERVICE_MIN_INTERVAL_MINUTES = "720"
  SOURCEFOUNDRY_SELF_SERVICE_MAX_ITEMS_PER_FETCH = "10"
  SOURCEFOUNDRY_SELF_SERVICE_MAX_ENROLLMENTS_PER_DAY = "50"
  SOURCEFOUNDRY_SELF_SERVICE_MAX_RUNS_PER_TENANT_PER_DAY = "6"
  SOURCEFOUNDRY_SELF_SERVICE_MAX_RUNS_TOTAL_PER_DAY = "24"

[processes]
  api = "node dist/src/server.js"
  worker = "node dist/src/worker.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
